name: CI
on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: requirements.txt }
      - run: sudo apt-get update && sudo apt-get install -y tesseract-ocr
      - run: pip install -r requirements.txt ziglang
      - run: python -m pytest tests -q

  installer-checks:
    # The Windows installer can't be run in CI, but it can be parsed, and the .exe can be built.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: PowerShell scripts parse cleanly
        shell: powershell
        run: |
          foreach ($f in 'installer\install-windows.ps1','installer\uninstall-windows.ps1') {
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $f), [ref]$null, [ref]$errors)
            if ($errors) { $errors | ForEach-Object { Write-Error $_ }; exit 1 }
          }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install ziglang
      - run: python installer/build_windows_exe.py
