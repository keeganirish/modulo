name: Release
# Tag a version (git tag v1.2.0 && git push --tags) to publish ModuloSetup.exe + the Mac/Linux package.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:   # manual run builds the files as a downloadable workflow artifact (no release)

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Tag must match VERSION
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          [ "${GITHUB_REF_NAME#v}" = "$(cat VERSION)" ] || { echo "Tag ${GITHUB_REF_NAME} does not match VERSION $(cat VERSION)"; exit 1; }
      - run: sudo apt-get update && sudo apt-get install -y tesseract-ocr
      - run: pip install -r requirements.txt ziglang
      - run: python -m pytest tests -q
      - run: python installer/build_windows_exe.py
      - name: Package Mac/Linux installer
        run: |
          mkdir -p stage && git archive --format=tar --prefix=Modulo/ HEAD | tar -x -C stage
          rm -rf stage/Modulo/.github stage/Modulo/tests
          (cd stage && zip -qr ../dist/Modulo-Installer.zip Modulo)
      - uses: actions/upload-artifact@v4
        with: { name: installers, path: dist/* }
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          generate_release_notes: true
          files: |
            dist/ModuloSetup.exe
            dist/Modulo-Installer.zip
